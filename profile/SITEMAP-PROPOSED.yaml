# profile/SITEMAP-PROPOSED.yaml
#
# NOT a real inventory -- see profile/SITEMAP.yaml for that. This is
# the real *target structure*: the hostname/path pattern the org is
# converging on, defined once so new subdomains/pages have an obvious
# shape to follow instead of each one being invented ad hoc.
#
# Real trigger (2026-08-28): defining the real lab.tcos.us <-> tcos.us
# sync rule surfaced a second, related question -- what shape do NEW
# *.tcos.us hostnames take as the org adds people/services. Spencer's
# real answer, his own words: "{<agent>|<oper>}.{blog,media,foo}[.lab]?
# .tcos.us" -- clean slug paths only, "no /page.ext just the slug, no
# .html or ugly shit".
#
# The real regex (hostname AND path) lives in one place, not copied
# here or anywhere else that consumes it:
#   human-execution-engine/library/py/hee_hostmap (APEX_RE,
#   PATH_SLUG_RE, classify_host(), is_clean_path()). classify_host()
#   matches <service> generically (any DNS label) -- there is no
#   enumerated service list in code to keep in sync with this file.

apex:
  rule: "lab.tcos.us == tcos.us"
  status: >
    NOT yet real. Bare lab.tcos.us resolves and returns 200 today, but
    only by accident -- no dedicated haproxy ACL/backend exists for
    it, so it falls through to default_backend be_view and serves
    view's content, not tcos-www's.
  action_required: >
    a real, dedicated haproxy ACL + backend for the bare lab.tcos.us
    Host header, serving tcos-www's real content, once Step 1 of the
    clone plan deploys it -- replacing the accidental be_view
    fallback, not layering on top of it.

pattern:
  shape: "{person}.{service}[.lab].tcos.us"
  person:
    required: false
    covers: >
      both an Oper name (e.g. spencer) and an Agent name (e.g.
      touchy-claude) -- the DNS label alone can't and shouldn't try to
      distinguish which; that classification belongs in SITEMAP
      metadata, not the hostname.
    real_example: spencer.media.tcos.us
  services:
    - name: blog
      repo: resume
      real_today:
        - spencer.blog.tcos.us
      lab_mirror: "MAY -- already real, spencer.blog.lab.tcos.us exists (corrected 2026-08-28, was stale)"
      hub:
        shape: "{service}[.lab].tcos.us (no person prefix)"
        meaning: >
          Distinct from the person-optional case above (a single
          shared resource like foo/man): this is a real directory/
          aggregator page listing every operator's own instance, not
          a specific person's content. Real today, both prod and lab
          -- confirmed live 2026-08-28 (resume#31/#32).
        real_today:
          - blog.tcos.us
          - blog.lab.tcos.us
    - name: media
      repo: resume
      real_today:
        - spencer.media.tcos.us
      lab_mirror: "MAY -- already real, spencer.media.lab.tcos.us exists"
      hub:
        shape: "{service}[.lab].tcos.us (no person prefix)"
        meaning: >
          Same hub/aggregator distinction as blog's hub entry above.
          Real today, both prod and lab -- confirmed live 2026-08-28
          (resume#31/#32).
        real_today:
          - media.tcos.us
          - media.lab.tcos.us
    - name: foo
      repo: unknown
      real_today:
        - foo.tcos.us  # bare, no person prefix -- the shared dogfood slot, tenant rotates
      lab_mirror: >
        not planned -- foo.tcos.us runs on separate DigitalOcean
        infra (159.65.46.8), outside the pve/haproxy stack this
        pattern otherwise governs.
    - name: man
      repo: unknown
      real_today:
        - man.tcos.us  # bare, no person prefix -- also real Gopher content, untouched
      lab_mirror: >
        not planned -- same external DigitalOcean infra as foo, kept
        as-is; only the HTTP presentation blends into the new design
        system, per Spencer's real instruction.
  expansion: >
    <service> matches any real DNS label generically -- hee_hostmap
    has no enumerated service list in code to edit. Adding a real
    service is a pure data change, one new entry under services:
    above -- never a regex/code change. Real correction, Spencer
    direct, 2026-08-28: an earlier version of hee_hostmap hardcoded
    an alternation of known names, which was exactly backwards.

lab_only_no_mirror_expected:
  # real *.lab.tcos.us subdomains today (pve/haproxy/haproxy.cfg,
  # /etc/bind/zones/db.lab.tcos.us) that are lab-internal tooling, not
  # a "MAY" mirror candidate -- this asymmetry is correct by design,
  # not a gap to fill in later.
  - ns1
  - bastion
  - haproxy
  - view
  - thesis-engine
  - owner-dogfood
  - container-factory
  - lab-to-prod-deploy
  - mx1  # MX record, not a web host at all

decommissioned:
  # real hosts that used to be live and were intentionally killed --
  # they still match the pattern's shape (hee_hostmap classifies
  # syntax, not realness), they're just gone now.
  - name: rtfm.tcos.us
    killed: 2026-08-28
    reason: >
      abandoned, real TLS cert mismatch found this session, not worth
      fixing. Real Cloudflare A record (159.65.46.8) deleted via the
      API (zone f7653a2322319cb118516b533d12a564), confirmed gone
      against Cloudflare's own authoritative nameserver, not just a
      local dig result.
  # bofh.tcos.us: real, live-checked 2026-08-28 -- never had a DNS
  # record in this zone. Nothing to kill; not listed above because it
  # was never real to begin with, not because it was removed.

paths:
  rule: "clean slugs only -- no file extension, no trailing '/index.html' ugliness"
  validator: human-execution-engine/library/py/hee_hostmap.is_clean_path
  examples:
    good:
      - /
      - /contracts
      - /people/spencer
    bad:
      - /contracts.html
      - /index.html
      - /tux-tattoo/
  known_violation: >
    spencer.media.tcos.us/tux-tattoo/ -- real trailing slash, already
    tracked in .github#47, not yet fixed.
