# The org profile's Releases table, kept current from GitHub Releases.
# Daily and on demand: regenerate; if the README changed, open a PR with
# the new table (never a push to main -- rule 1). A release promoted by
# `hee release` therefore shows up on the org page within a day, or at
# once via workflow_dispatch.
name: releases-table
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/render-releases.py --write
      - name: open a PR if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- profile/README.md && { echo "table current"; exit 0; }
          b="chore/releases-table-$(date -u +%Y%m%d)"
          git config user.name "tcos-releases-table"; git config user.email "dev@tcos.us"
          git switch -c "$b" && git add profile/README.md \
            && git commit -m "chore(profile): releases table from GitHub Releases, $(date -u +%F)" \
            && git push -u origin "$b" \
            && gh pr create --base main --title "chore(profile): releases table, $(date -u +%F)" \
                 --body "Regenerated by bin/render-releases.py from GitHub Releases. Review the rows, merge."
